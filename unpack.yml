name: Unpack zip
on:
  workflow_dispatch:
  push:
    paths: ['PillTrack.zip']
permissions:
  contents: write
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack PillTrack.zip into the repo
        run: |
          unzip -oq PillTrack.zip -d _unz
          rsync -a --exclude .github _unz/*/ ./
          rm -rf _unz PillTrack.zip
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Update PillTrack from zip" || echo "Nothing to commit"
          git push
      - name: Start the APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Build APK" --ref "${{ github.ref_name }}"
